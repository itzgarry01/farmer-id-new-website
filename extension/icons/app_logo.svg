<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F8547"/>
      <stop offset="100%" stop-color="#145A2F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>

  <!-- Top Growth Leaf Sprout -->
  <path d="M256 165 C256 95, 298 70, 350 70 C350 125, 310 165, 256 165 Z" fill="url(#goldGrad)"/>
  <path d="M256 165 C256 115, 214 90, 162 90 C162 138, 196 165, 256 165 Z" fill="url(#sproutGrad)"/>

  <!-- Identity Card Canvas -->
  <rect x="96" y="165" width="320" height="230" rx="24" fill="#FFFFFF" filter="url(#cardShadow)"/>
  
  <!-- Card Header Stripe -->
  <path d="M96 189 A24 24 0 0 1 120 165 L392 165 A24 24 0 0 1 416 189 L416 205 L96 205 Z" fill="#1F8547"/>
  <circle cx="130" cy="185" r="8" fill="#FBBF24"/>

  <!-- Photo Box -->
  <rect x="316" y="225" width="74" height="90" rx="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="353" cy="254" r="16" fill="#94A3B8"/>
  <path d="M328 302 C328 284, 378 284, 378 302 Z" fill="#94A3B8"/>

  <!-- Text Details Line Simulations -->
  <rect x="126" y="230" width="120" height="16" rx="8" fill="#1F8547"/>
  <rect x="126" y="260" width="160" height="12" rx="6" fill="#CBD5E1"/>
  <rect x="126" y="284" width="140" height="12" rx="6" fill="#CBD5E1"/>
  <rect x="126" y="308" width="100" height="12" rx="6" fill="#CBD5E1"/>

  <!-- Microchip / Security Badge -->
  <rect x="126" y="338" width="48" height="36" rx="6" fill="url(#goldGrad)"/>
  <rect x="136" y="348" width="28" height="16" rx="3" fill="#92400E" fill-opacity="0.3"/>
  
  <!-- Denso QR Symbol Preview on Card -->
  <rect x="336" y="332" width="44" height="44" rx="6" fill="#0F172A"/>
  <rect x="344" y="340" width="12" height="12" fill="#FFFFFF"/>
  <rect x="360" y="340" width="12" height="12" fill="#FFFFFF"/>
  <rect x="344" y="356" width="12" height="12" fill="#FFFFFF"/>
  <rect x="364" y="360" width="8" height="8" fill="#22C55E"/>
</svg>