<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriStack Operator Wallet Top-Up - Secure Payment</title>
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-canvas: #FAF6EE;
            --bg-canvas-subtle: #F4EBE0;
            --bg-card: #FFFFFF;
            --text-main: #1E1815;
            --text-secondary: #5C524C;
            --accent-orange: #E65C38;
            --accent-yellow: #FFBA08;
            --accent-green: #2B9348;
            --border-dark: #1E1815;
            --shadow-hard: 4px 4px 0px #1E1815;
            --shadow-hard-lg: 7px 7px 0px #1E1815;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(rgba(30, 24, 21, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .checkout-card {
            background: var(--bg-card);
            border: 3px solid var(--border-dark);
            border-radius: 24px;
            width: 100%;
            max-width: 460px;
            box-shadow: var(--shadow-hard-lg);
            overflow: hidden;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .checkout-header {
            background: var(--accent-yellow);
            border-bottom: 2.5px solid var(--border-dark);
            color: var(--text-main);
            padding: 22px 20px;
            text-align: center;
        }

        .checkout-header .badge-tag {
            display: inline-block;
            background: #FFF;
            border: 1.5px solid var(--border-dark);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 12px;
            border-radius: 9999px;
            margin-bottom: 8px;
            box-shadow: 2px 2px 0px #1E1815;
        }

        .checkout-header h2 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 22px;
            font-weight: 800;
        }

        .checkout-body {
            padding: 28px 24px;
        }

        .order-summary {
            background: var(--bg-canvas-subtle);
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 2px 2px 0px #1E1815;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .summary-row.total {
            border-top: 2px solid var(--border-dark);
            padding-top: 10px;
            margin-top: 10px;
            margin-bottom: 0;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-green);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 13.5px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-canvas-subtle);
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            color: var(--text-main);
            padding: 11px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 800;
            outline: none;
            box-shadow: 2px 2px 0px #1E1815;
        }

        .amount-chips {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .chip {
            flex: 1;
            background: #FFF;
            border: 2px solid var(--border-dark);
            color: var(--text-main);
            padding: 8px 4px;
            border-radius: 9999px;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            box-shadow: 2px 2px 0px #1E1815;
            transition: all 0.15s;
        }

        .chip:hover, .chip.active {
            background: var(--accent-yellow);
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #1E1815;
        }

        .btn-pay {
            width: 100%;
            background: var(--accent-orange);
            color: #FFFFFF;
            border: 2.5px solid var(--border-dark);
            border-radius: 9999px;
            padding: 14px;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-hard);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s;
            margin-top: 20px;
        }

        .btn-pay:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #1E1815;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
        }

        .back-link:hover {
            color: var(--accent-orange);
        }
    </style>
</head>
<body>
    <div class="checkout-card">
        <div class="checkout-header">
            <div class="badge-tag">🔒 256-Bit Encrypted Payment</div>
            <h2>AgriStack Operator Top-Up</h2>
        </div>

        <div class="checkout-body">
            <div class="order-summary">
                <div class="summary-row">
                    <span>Service:</span>
                    <strong>PVC Card Printing Balance</strong>
                </div>
                <div class="summary-row">
                    <span>Rate:</span>
                    <span>₹15 / Generated Card</span>
                </div>
                <div class="summary-row total">
                    <span>Recharge Amount:</span>
                    <span id="displayTotal">₹1,000.00</span>
                </div>
            </div>

            <div class="form-group">
                <label>Operator Mobile Number:</label>
                <input type="tel" id="mobileInput" class="form-input" value="7009980800" maxlength="10" placeholder="10-digit mobile">
            </div>

            <div class="form-group">
                <label>Select Top-Up Pack:</label>
                <div class="amount-chips">
                    <button class="chip" onclick="setRechargeAmount(100)">₹100</button>
                    <button class="chip" onclick="setRechargeAmount(250)">₹250</button>
                    <button class="chip" onclick="setRechargeAmount(500)">₹500</button>
                    <button class="chip active" onclick="setRechargeAmount(1000)">₹1,000</button>
                </div>
            </div>

            <button class="btn-pay" id="btnPay" onclick="handlePayment()">
                <i class="fa-solid fa-bolt"></i> Pay & Add Balance Instantly
            </button>

            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Return to Homepage
            </a>
        </div>
    </div>

    <script>
        let selectedAmount = 1000;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('amount')) {
            const amt = parseInt(urlParams.get('amount'), 10);
            if (!isNaN(amt) && amt > 0) {
                setRechargeAmount(amt);
            }
        }

        function setRechargeAmount(amt) {
            selectedAmount = amt;
            document.getElementById('displayTotal').textContent = `₹${amt.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
            
            document.querySelectorAll('.amount-chips .chip').forEach(chip => {
                chip.classList.remove('active');
                if (chip.textContent.includes(amt)) {
                    chip.classList.add('active');
                }
            });
        }

        function handlePayment() {
            const mobile = document.getElementById('mobileInput').value.trim();
            if (!mobile || mobile.length !== 10) {
                alert('Please enter a valid 10-digit mobile number.');
                return;
            }

            const btn = document.getElementById('btnPay');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing Secure Payment...';

            setTimeout(() => {
                const currentBal = parseFloat(localStorage.getItem('agristack_operator_bal') || '1000');
                const newBal = currentBal + selectedAmount;
                localStorage.setItem('agristack_operator_bal', String(newBal));
                localStorage.setItem('agristack_operator_mobile', mobile);

                alert(`🎉 Payment of ₹${selectedAmount.toLocaleString('en-IN')} successful! Your updated balance is ₹${newBal.toLocaleString('en-IN')}.`);
                window.location.href = 'index.html#wallet';
            }, 1200);
        }
    </script>
</body>
</html>
