<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriStack Operator Wallet Top-Up - Secure Payment</title>
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #10B981;
            --primary-dark: #059669;
            --accent-orange: #FFA400;
            --bg: #080C14;
            --card-bg: #0E1524;
            --text: #F8FAFC;
            --subtext: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .checkout-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 30px rgba(16, 185, 129, 0.15);
            overflow: hidden;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .checkout-header {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: #FFFFFF;
            padding: 24px 20px;
            text-align: center;
        }

        .checkout-header .badge-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 8px;
        }

        .checkout-header h2 {
            font-size: 20px;
            font-weight: 800;
        }

        .checkout-body {
            padding: 28px 24px;
        }

        .order-summary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--subtext);
            margin-bottom: 8px;
        }

        .summary-row.total {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 10px;
            margin-bottom: 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--subtext);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 700;
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
        }

        .amount-chips {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .chip {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 4px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .chip:hover, .chip.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--primary);
            color: #FFFFFF;
        }

        .btn-pay {
            width: 100%;
            background: linear-gradient(135deg, #10B981, #059669);
            color: #FFFFFF;
            border: none;
            border-radius: 9999px;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            margin-top: 20px;
        }

        .btn-pay:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--subtext);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="checkout-card">
        <div class="checkout-header">
            <div class="badge-tag">🔒 256-Bit Encrypted Payment</div>
            <h2>AgriStack Operator Top-Up</h2>
        </div>

        <div class="checkout-body">
            <div class="order-summary">
                <div class="summary-row">
                    <span>Service:</span>
                    <strong>PVC Card Printing Balance</strong>
                </div>
                <div class="summary-row">
                    <span>Rate:</span>
                    <span>₹15 / Generated Card</span>
                </div>
                <div class="summary-row total">
                    <span>Recharge Amount:</span>
                    <span id="displayTotal">₹1,000.00</span>
                </div>
            </div>

            <div class="form-group">
                <label>Operator Mobile Number:</label>
                <input type="tel" id="mobileInput" class="form-input" value="7009980800" maxlength="10" placeholder="10-digit mobile">
            </div>

            <div class="form-group">
                <label>Select Top-Up Pack:</label>
                <div class="amount-chips">
                    <button class="chip" onclick="setRechargeAmount(100)">₹100</button>
                    <button class="chip" onclick="setRechargeAmount(250)">₹250</button>
                    <button class="chip" onclick="setRechargeAmount(500)">₹500</button>
                    <button class="chip active" onclick="setRechargeAmount(1000)">₹1,000</button>
                </div>
            </div>

            <button class="btn-pay" id="btnPay" onclick="handlePayment()">
                <i class="fa-solid fa-bolt"></i> Pay & Add Balance Instantly
            </button>

            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Return to Homepage
            </a>
        </div>
    </div>

    <script>
        let selectedAmount = 1000;

        // Read query params
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('amount')) {
            const amt = parseInt(urlParams.get('amount'), 10);
            if (!isNaN(amt) && amt > 0) {
                setRechargeAmount(amt);
            }
        }

        function setRechargeAmount(amt) {
            selectedAmount = amt;
            document.getElementById('displayTotal').textContent = `₹${amt.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
            
            document.querySelectorAll('.amount-chips .chip').forEach(chip => {
                chip.classList.remove('active');
                if (chip.textContent.includes(amt)) {
                    chip.classList.add('active');
                }
            });
        }

        function handlePayment() {
            const mobile = document.getElementById('mobileInput').value.trim();
            if (!mobile || mobile.length !== 10) {
                alert('Please enter a valid 10-digit mobile number.');
                return;
            }

            const btn = document.getElementById('btnPay');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing Secure Payment...';

            setTimeout(() => {
                const currentBal = parseFloat(localStorage.getItem('agristack_operator_bal') || '1000');
                const newBal = currentBal + selectedAmount;
                localStorage.setItem('agristack_operator_bal', String(newBal));
                localStorage.setItem('agristack_operator_mobile', mobile);

                alert(`🎉 Payment of ₹${selectedAmount.toLocaleString('en-IN')} successful! Your updated balance is ₹${newBal.toLocaleString('en-IN')}.`);
                window.location.href = 'index.html#wallet';
            }, 1200);
        }
    </script>
</body>
</html>
